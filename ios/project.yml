name: FreeFlow
options:
  bundleIdPrefix: com.shebetoff.freeflow
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  FreeFlowApp:
    type: application
    platform: iOS
    scheme:
      testTargets: []
      gatherCoverageData: false
      commandLineArguments: {}
      environmentVariables: {}
    sources:
      - path: FreeFlowApp
        excludes:
          - "Info.plist"
          - "FreeFlowApp.entitlements"
      - path: FreeFlowShared
    info:
      path: FreeFlowApp/Info.plist
      properties:
        CFBundleDisplayName: FreeFlow
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        NSMicrophoneUsageDescription: "FreeFlow records your voice so Groq can transcribe it to text."
        UIBackgroundModes:
          - audio
        CFBundleURLTypes:
          - CFBundleURLName: com.shebetoff.freeflow.ios
            CFBundleURLSchemes:
              - freeflow
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
          - microphone
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: FreeFlowApp/FreeFlowApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.shebetoff.freeflow
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.shebetoff.freeflow.shared
    dependencies:
      - target: FreeFlowKeyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shebetoff.freeflow.ios
        PRODUCT_NAME: FreeFlow
        SWIFT_EMIT_LOC_STRINGS: "YES"

  FreeFlowKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: FreeFlowKeyboard
        excludes:
          - "Info.plist"
          - "FreeFlowKeyboard.entitlements"
      - path: FreeFlowShared
    info:
      path: FreeFlowKeyboard/Info.plist
      properties:
        CFBundleDisplayName: FreeFlow
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundlePackageType: XPC!
        NSMicrophoneUsageDescription: "FreeFlow records your voice so Groq can transcribe it to text."
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
    entitlements:
      path: FreeFlowKeyboard/FreeFlowKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.shebetoff.freeflow
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.shebetoff.freeflow.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shebetoff.freeflow.ios.keyboard
        PRODUCT_NAME: FreeFlowKeyboard
        PRODUCT_MODULE_NAME: FreeFlowKeyboard
        SWIFT_EMIT_LOC_STRINGS: "YES"
